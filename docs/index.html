<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTCWatcher – macOS Cryptocurrency Price Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #07050f;
  --surface:   #0d0a1c;
  --surface2:  #120f24;
  --surface3:  #1a1530;

  --purple:    #b44fff;
  --pink:      #ff3fa4;
  --cyan:      #00e5ff;

  --glow-p:    rgba(180,79,255,0.22);
  --glow-pk:   rgba(255,63,164,0.18);
  --glow-c:    rgba(0,229,255,0.14);

  --border:    rgba(180,79,255,0.25);
  --border2:   rgba(255,63,164,0.35);
  --border-c:  rgba(0,229,255,0.2);

  --text:      #ede8ff;
  --text-muted:#7a6fa0;
  --text-dim:  #3d3560;

  --green:     #0ff4a0;
  --red:       #ff4466;

  --mono:      'Share Tech Mono', monospace;
  --title:     'Orbitron', sans-serif;
  --body:      'Rajdhani', sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  font-family: var(--body);
  background: var(--bg);
  min-height: 100vh;
  min-width: 350px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  overflow-x: auto;
  position: relative;
}

/* Grid bg */
body::before {
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(180,79,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,79,255,0.04) 1px, transparent 1px);
  background-size:44px 44px;
  pointer-events:none;
}

/* Dual ambient glow */
body::after {
  content:'';
  position:fixed;
  top:-160px; left:-100px;
  width:600px; height:600px;
  background: radial-gradient(circle, rgba(180,79,255,0.09) 0%, transparent 65%);
  pointer-events:none;
}
.glow-right {
  position:fixed;
  bottom:-140px; right:-80px;
  width:500px; height:500px;
  background: radial-gradient(circle, rgba(255,63,164,0.08) 0%, transparent 65%);
  pointer-events:none;
  z-index:0;
}

/* ── CARD ── */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 580px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0;
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
}

/* Diagonal corner accent lines */
.card::before {
  content:'';
  position:absolute;
  top:0; right:0;
  width:28px; height:28px;
  border-top: 2px solid var(--pink);
  border-right: 2px solid var(--pink);
  pointer-events:none;
  z-index:2;
}
.card::after {
  content:'';
  position:absolute;
  bottom:0; left:0;
  width:28px; height:28px;
  border-bottom: 2px solid var(--purple);
  border-left: 2px solid var(--purple);
  pointer-events:none;
  z-index:2;
}

/* ── TOPBAR ── */
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 9px 28px;
  background: rgba(0,0,0,0.45);
  border-bottom: 1px solid var(--border);
}
.topbar-left {
  display:flex;
  align-items:center;
  gap:8px;
  font-family: var(--mono);
  font-size:14px;
  line-height:1;
  color: #8878b8;
  letter-spacing:.1em;
}
.live-dot {
  width:6px;height:6px;
  border-radius:50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.topbar-right {
  display:flex;
  align-items:center;
  gap:6px;
}
.lang-switch {
  display:flex;
  align-items:center;
  gap:6px;
}
.lang-btn {
  font-family:var(--mono);
  font-size:14px;
  line-height:1;
  color:#8878b8;
  background:none;border:none;
  cursor:pointer;
  letter-spacing:.1em;
  padding:3px 6px;
  transition:color .15s;
}
.lang-btn.active { color:var(--purple); }
.lang-btn:hover  { color:var(--pink); }
.lang-sep { color:#8878b8; font-size:14px; line-height:1; }
.mode-btn {
  display:flex;
  align-items:center;
  gap:6px;
  height:22px;
  padding:0 8px;
  font-family:var(--mono);
  font-size:12px;
  line-height:1;
  color:var(--cyan);
  background:rgba(0,229,255,0.06);
  border:1px solid var(--border-c);
  cursor:pointer;
  letter-spacing:.1em;
  transition:border-color .2s, color .2s, background .2s;
}
.mode-btn:hover {
  color:var(--text);
  border-color:rgba(0,229,255,0.45);
  background:rgba(0,229,255,0.11);
}
.mode-dot {
  width:5px;
  height:5px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 7px currentColor;
}

/* ── INNER ── */
.inner { padding: 28px 28px 26px; }

/* ── HEADER ── */
.eyebrow {
  font-family: var(--mono);
  font-size:14px;
  line-height:1;
  letter-spacing: .18em;
  color: #8878b8;
  margin-bottom: 10px;
}
.eyebrow em {
  color: var(--purple);
  font-style:normal;
}

.title-row {
  display:flex;
  align-items:flex-end;
  gap:12px;
  margin-bottom:24px;
}
h1 {
  font-family: var(--title);
  font-size: 2.6rem;
  font-weight: 900;
  line-height: 1;
  letter-spacing:.04em;
  background: linear-gradient(110deg, var(--purple) 0%, var(--pink) 55%, #ff8c69 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.badge {
  display:inline-block;
  font-family:var(--mono);
  font-size:14px;
  line-height:1;
  color:var(--cyan);
  border:1px solid var(--border-c);
  background: rgba(0,229,255,0.06);
  padding:4px 8px;
  letter-spacing:.1em;
  margin-bottom:4px;
}

/* ── DEMO ── */
.demo {
  border: 1px solid var(--border2);
  margin-bottom: 22px;
  position:relative;
  background: var(--surface2);
  overflow:hidden;
  border-radius: 8px;
  box-shadow: 0 0 24px rgba(180,79,255,0.12), 0 0 48px rgba(255,63,164,0.08);
}

/* scanlines */
.demo::after {
  content:'';
  position:absolute;inset:0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(180,79,255,0.025) 3px, rgba(180,79,255,0.025) 4px
  );
  pointer-events:none;
  z-index:1;
}



.fake-desktop {
  height:120px;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(180,79,255,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 30%, rgba(255,63,164,0.15) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 100%, rgba(0,229,255,0.07) 0%, transparent 55%),
    linear-gradient(160deg, #130d28 0%, #0e0820 100%);
  position:relative;
  border-radius:0 0 8px 8px;
}

/* macOS-style menu bar */
.menu-bar {
  position:absolute;
  top:0;left:0;right:0;
  height:27px;
  background:rgba(7,5,20,0.88);
  border-bottom:1px solid rgba(180,79,255,0.15);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  backdrop-filter:blur(16px);
  z-index:2;
}
.mb-left {
  display:flex;gap:12px;align-items:center;
}
.mb-apple { font-size:14px;color:var(--text); }
.mb-item  {
  font-family:var(--body);
  font-size:14px;
  font-weight:500;
  color:rgba(237,232,255,.4);
  letter-spacing:.03em;
}
.mb-right {
  display:flex;align-items:center;gap:12px;
}
.ticker-wrap {
  display:flex;align-items:center;gap:5px;
  font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;font-size:15px;
}
.t-price  { color:#ffffff; font-size:15px; font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
.t-up     { color:#ffffff; font-size:13px; font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
.t-dn     { color:#ffffff; font-size:13px; font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
.mb-clock {
  font-family:var(--mono);
  font-size:14px;
  color:rgba(237,232,255,.4);
}

/* Floating window */
.fake-win {
  position:absolute;
  left:50%;bottom:14px;
  transform:translateX(-50%);
  width:62%;
  background:rgba(18,15,36,0.95);
  border:1px solid rgba(180,79,255,0.35);
  border-radius:5px;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(255,63,164,0.1),
    0 8px 32px rgba(0,0,0,0.7),
    0 0 30px rgba(180,79,255,0.18);
}
.fake-win-bar {
  height:20px;
  background:rgba(0,0,0,0.5);
  border-bottom:1px solid rgba(180,79,255,0.1);
  display:flex;align-items:center;padding:0 8px;gap:5px;
}
.fake-win-bar span {
  width:6px;height:6px;border-radius:50%;
}
.fake-win-bar span:nth-child(1){background:rgba(255,95,87,.6);}
.fake-win-bar span:nth-child(2){background:rgba(254,188,46,.6);}
.fake-win-bar span:nth-child(3){background:rgba(40,200,64,.6);}
.fake-line {
  height:4px;
  margin:8px 12px 5px;
  border-radius:1px;
  background:rgba(180,79,255,0.12);
}
.fake-line:nth-child(2){width:70%;}
.fake-line:nth-child(3){width:50%;}
.fake-line:nth-child(4){width:60%;}

/* ── DIVIDER ── */
.divider {
  height:1px;
  background: linear-gradient(90deg, transparent, var(--border2) 40%, var(--border) 100%);
  margin-bottom:20px;
}

/* ── PURE MODE ── */
.pure-panel {
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.pure-ticker {
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}
.pure-price {
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  font-size:2.75rem;
  font-weight:700;
  line-height:1;
  color:var(--text);
  letter-spacing:0;
  text-shadow:0 0 24px rgba(0,229,255,0.2);
}
.pure-change {
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  font-size:1.15rem;
  font-weight:600;
  line-height:1;
  letter-spacing:0;
}
.pure-change.is-up { color:var(--green); }
.pure-change.is-down { color:var(--red); }
.card.is-pure .lang-switch,
.card.is-pure .eyebrow,
.card.is-pure .title-row,
.card.is-pure .demo,
.card.is-pure .divider,
.card.is-pure .features,
.card.is-pure .cta-row,
.card.is-pure .footer-license,
.card.is-pure .footer-r {
  display:none;
}
.card.is-pure .inner {
  min-height:406px;
  padding-top:0;
  display:grid;
  grid-template-rows:1fr auto;
}
.card.is-pure .pure-panel {
  display:flex;
  align-self:center;
  min-height:0;
}
.card.is-pure .footer {
  justify-content:center;
}

/* ── FEATURES ── */
.features {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:22px;
}
.feature {
  position:relative;
  padding:14px 16px;
  min-height:68px;
  border:1px solid var(--border);
  background: linear-gradient(135deg, rgba(180,79,255,0.04) 0%, rgba(255,63,164,0.02) 100%);
  overflow:hidden;
  transition:border-color .2s, background .2s;
}
.feature::before {
  content:'';
  position:absolute;
  top:0;left:0;
  width:2px;height:100%;
  background: linear-gradient(180deg, var(--purple), var(--pink));
  opacity:.6;
}
.feature:hover {
  border-color: rgba(180,79,255,0.5);
  background: linear-gradient(135deg, rgba(180,79,255,0.09) 0%, rgba(255,63,164,0.05) 100%);
}
.f-tag {
  font-family:var(--mono);
  font-size:11px;
  line-height:1;
  letter-spacing:.14em;
  color:var(--pink);
  margin-bottom:6px;
}
.f-label {
  font-family:var(--body);
  font-size:14px;
  font-weight:600;
  color:var(--text);
  line-height:18px;
  letter-spacing:.02em;
}

/* ── CTA ── */
.cta-row {
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-bottom:22px;
}
.btn-dl {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:15px 24px;
  background: linear-gradient(110deg, var(--purple) 0%, var(--pink) 100%);
  color:#fff;
  font-family:var(--body);
  font-size:15px;
  line-height:1;
  font-weight:700;
  letter-spacing:.08em;
  text-decoration:none;
  border:none;cursor:pointer;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  transition: filter .15s, transform .1s;
  position:relative;
}
.btn-dl::after {
  content:'';
  position:absolute;
  inset:-1px;
  background: linear-gradient(90deg, var(--purple), var(--pink), var(--purple));
  background-size: 300% 100%;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  z-index:-1;
  animation: border-flow 8s linear infinite;
  filter: blur(4px);
  opacity: 0.9;
}
@keyframes border-flow {
  0%   { background-position: 0% 0%; }
  100% { background-position: 300% 0%; }
}
.btn-dl:hover { filter:brightness(1.2); transform:translateY(-1px); }
.btn-dl:active{ transform:translateY(0); }

.btn-gh {
  display:flex;align-items:center;justify-content:center;
  padding:15px 16px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-muted);
  font-family:var(--mono);
  font-size:14px;
  line-height:1;
  text-decoration:none;
  gap:7px;
  transition:border-color .2s,color .2s;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
}
.btn-gh:hover { border-color:var(--border2); color:var(--text); }

/* ── FOOTER ── */
.footer {
  border-top:1px solid var(--border);
  padding-top:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.footer-l {
  font-family:var(--mono);
  font-size:13px;
  line-height:1;
  color:var(--text-dim);
  letter-spacing:.1em;
}
.footer-l em { color:var(--purple); font-style:normal; }
.footer-r {
  font-family:var(--mono);
  font-size:13px;
  line-height:1;
  color:var(--text-dim);
}

@media(max-width:480px){
  h1{font-size:1.7rem;}
  .features{grid-template-columns:1fr;}
  .cta-row{grid-template-columns:1fr;}
  .btn-gh{display:none;}
  .inner{padding:18px 16px 18px;}
  .topbar{padding:8px 16px;}
  .topbar-left{font-size:14px;letter-spacing:.06em;}
  .eyebrow{font-size:14px;letter-spacing:.1em;min-height:28px;}
  .pure-ticker{gap:10px;}
  .pure-price{font-size:2rem;}
  .pure-change{font-size:1rem;}
  .card.is-pure .inner{min-height:294px;}
  .badge{font-size:14px;padding:3px 6px;}
  .mb-left .mb-item{display:none;}
  .mb-clock{font-size:14px;}
  .ticker-wrap{font-size:14px;}
  .t-price{font-size:14px;}
  .t-up,.t-dn{font-size:14px;}
  .footer{flex-direction:column;gap:6px;align-items:flex-start;}
  .card.is-pure .footer{align-items:center;}
  .footer-l,.footer-r{font-size:14px;}
  .lang-btn,.lang-sep{font-size:14px;}
  .mode-btn{font-size:12px;}
}
</style>
</head>

</div>

<script>
const T = {
  en:{
    title:"BTCWatcher – macOS Cryptocurrency Price Tracker",
    live:"LIVE · BTCUSDT",
    eyebrow:"CRYPTO PRICE TRACKER · MACOS MENUBAR",
    ver:"v1.4.4",
    demoTitle:"// MENUBAR_PREVIEW.app",
    f1tag:"REALTIME", f1:"Real-time Binance prices",
    f2tag:"DISPLAY",  f2:"Menu bar price display",
    f3tag:"ANALYTICS",f3:"Entry price, PnL & ROI",
    f4tag:"NETWORK",  f4:"Proxy & API failover",
    pureMode:"PURE",
    fullMode:"FULL",
    download:"FREE DOWNLOAD",
    footerData:"DATA · BINANCE API",
    footerLicense:" · MIT LICENSE"
  },
  zh:{
    title:"BTCWatcher – macOS 加密货币价格追踪",
    live:"实时 · BTCUSDT",
    eyebrow:"加密货币价格追踪 · MACOS 菜单栏",
    ver:"v1.4.4",
    demoTitle:"// 菜单栏预览.app",
    f1tag:"实时行情", f1:"币安实时价格",
    f2tag:"菜单显示", f2:"菜单栏价格展示",
    f3tag:"收益分析", f3:"开仓价、盈亏与 ROI",
    f4tag:"网络",     f4:"代理与 API 故障切换",
    pureMode:"纯净",
    fullMode:"完整",
    download:"免费下载",
    footerData:"数据 · 币安 API",
    footerLicense:" · MIT 协议"
  }
};

let lang="en";
let pureMode=false;
let tickerTimer=null;

function applyLang(l){
  lang=l;
  const t=T[l]||T.en;
  document.title=t.title;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.dataset.i18n;
    if(t[k]!=null) el.textContent=t[k];
  });
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));
  updateModeLabel();
}

function updateModeLabel(){
  const t=T[lang]||T.en;
  const label=document.querySelector("[data-i18n='pureMode']");
  if(label) label.textContent=pureMode?t.fullMode:t.pureMode;
}

function applyMode(next){
  pureMode=next;
  document.querySelector(".card").classList.toggle("is-pure",pureMode);
  updateModeLabel();
  scheduleTicker();
}

function fmt(v){
  const p=Number(v);
  if(!isFinite(p))return"65,000.00";
  if(p<0.01)return p.toFixed(8);
  if(p<1)return p.toFixed(6);
  if(p<100)return p.toFixed(4);
  return p.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function renderTicker(d){
  const price=fmt(d.lastPrice);
  const chg=Number(d.priceChangePercent);
  const sign=chg>=0?"+":"";
  document.getElementById("btc-price").textContent=`₿ ${price}`;
  document.getElementById("pure-price").textContent=`₿ ${price}`;
  const cel=document.getElementById("btc-change");
  const pureCel=document.getElementById("pure-change");
  cel.textContent=`(${sign}${chg.toFixed(2)}%)`;
  pureCel.textContent=cel.textContent;
  cel.className=chg>=0?"t-up":"t-dn";
  pureCel.className=chg>=0?"pure-change is-up":"pure-change is-down";
}

function updateClock(){
  document.getElementById("menu-clock").textContent=
    new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
}

async function fetchTicker(){
  try{
    const r=await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT",{signal:AbortSignal.timeout(6000)});
    if(r.ok)renderTicker(await r.json());
  }catch(_){renderTicker({lastPrice:"65000",priceChangePercent:"5.25"});}
}

function scheduleTicker(){
  if(tickerTimer)clearInterval(tickerTimer);
  tickerTimer=setInterval(fetchTicker,pureMode?1500:3000);
}

document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
document.querySelector("[data-mode-toggle]").addEventListener("click",()=>applyMode(!pureMode));
renderTicker({lastPrice:"65000",priceChangePercent:"5.25"});
applyLang("en");
updateClock();
setInterval(updateClock,1000);
fetchTicker();
scheduleTicker();
</script>
</body>
</html>
